name: Flight Watch

on:
  # Scheduled: Every Monday at 6:17 AM CET (avoiding :00 peak load)
  # Testing: Manual trigger via workflow_dispatch
  schedule:
    - cron: '17 5 * * 1'
      timezone: 'Europe/Oslo'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check-flights:
    runs-on: ubuntu-latest
    steps:
      - name: Log execution context
        run: |
          echo "Workflow triggered by: ${{ github.event_name }}"
          echo "Current time UTC: $(date -u)"
          echo "Timezone: Europe/Oslo (CET/CEST)"
          echo "Schedule: Every Monday 6:17 AM CET"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt

      - name: Run flight watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python flight_watch.py
        timeout-minutes: 10

      - name: Success notification
        if: success()
        run: echo "✅ Flight check completed successfully at $(date -u)"

      - name: Failure notification
        if: failure()
        run: echo "❌ Flight check failed at $(date -u)"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flight-watch-logs
          path: /tmp/flight_watch.log
          retention-days: 7
