name: Flight watch

on:
  schedule:
    # OBS: cron kjører i UTC. Disse tilsvarer ca 08:30 og 19:30 norsk tid om
    # sommeren (UTC+2). Etter overgangen til vintertid (siste søndag i
    # oktober) blir det 07:30 og 18:30 - juster hvis det plager deg.
    - cron: "30 6 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {} # lar deg trigge et søk manuelt fra Actions-fanen

# Trengs for at jobben skal få lov til å skrive state.json tilbake til repoet
# (brukes til "X kr billigere enn sist").
permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run flight watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flight_watch.py

      - name: Persist price history
        # Kjører også hvis søket delvis feilet, men skal aldri velte jobben
        if: always()
        continue-on-error: true
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "flight-watch"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "Oppdater prishistorikk [skip ci]"
            git push
          else
            echo "Ingen endring i state.json"
          fi
